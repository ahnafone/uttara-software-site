<div id="projects">
    <div>&nbsp;</div>

    <div>


        <div class="grid">
            @for(proj of projects; track $index) {
                <div class="project-outer">
                    <div class="project" role="link" tabindex="0" (click)="openProject($event, proj.link, proj.newTab)"
                        (auxclick)="openProjectFromAuxClick($event, proj.link, proj.newTab)"
                        (keydown)="handleProjectKeydown($event, proj.link, proj.newTab)">
                        <img [src]="proj.img"
                            [class]="{'pt-bg': proj.title=='Platypus Toys', 'sd-bg': proj.title=='Sarcomere Dynamics', 'rr-bg': proj.title=='Recyclorobo.ai'}"
                            alt="">
                        <h3>{{ proj.title }}</h3>
                        <p>{{ proj.desc }}</p>
                        <p class="goto-link"> go to site <fa-icon [icon]="faGoto" /> </p>
                    </div>
                </div>
            }
        </div><br><br>

        <div class="section-heading">
            <p>websites we’ve designed, developed, and delivered for our clients.</p>
        </div>
    </div>

    <div class="goto" role="button" tabindex="0" aria-label="Go to products" (click)="scrollToView()" (keydown)="handleArrowKeydown($event)" [class.show-arrow]="showArrow">
        <h3>products</h3>
        <fa-icon [icon]="faArrowDown" />
    </div>
</div>
